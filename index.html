<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101923">
  <meta name="description" content="Bakerzin Operations Dashboard">
  <title>Bakerzin Operations Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #2596be;
      --ink: #17202b;
      --muted: #667085;
      --surface: #ffffff;
      --bg: #f4f7f9;
      --border: #dfe6ea;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
    .shell { position: fixed; inset: 0; background: var(--bg); }
    .dashboard-frame { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
    .loading {
      position: absolute; inset: 0; z-index: 2; display: grid; place-items: center;
      padding: 24px; background: linear-gradient(145deg, #f8fbfc, #eef5f7);
      transition: opacity .25s ease, visibility .25s ease;
    }
    .loading.done { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading-card {
      width: min(420px, 100%); padding: 26px; text-align: center; border: 1px solid var(--border);
      border-radius: 18px; background: var(--surface); box-shadow: 0 18px 50px rgba(23,32,43,.1);
    }
    .mark {
      display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 16px;
      border-radius: 14px; background: linear-gradient(145deg, var(--brand), #19799b);
      color: #fff; font-size: 15px; font-weight: 800; letter-spacing: .04em;
    }
    h1 { margin: 0; font-size: 20px; line-height: 1.25; }
    p { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .progress { height: 5px; margin-top: 20px; overflow: hidden; border-radius: 99px; background: #eaf0f2; }
    .progress span { display: block; width: 38%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--brand), #65c7e5); animation: loading 1.15s ease-in-out infinite; }
    .fallback { display: none; margin-top: 18px; }
    .fallback.show { display: block; }
    .fallback a {
      display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 9px 15px;
      border-radius: 10px; background: var(--brand); color: #fff; font-size: 14px; font-weight: 700; text-decoration: none;
    }
    @keyframes loading { from { transform: translateX(-115%); } to { transform: translateX(310%); } }
    @media (prefers-reduced-motion: reduce) { .progress span { animation-duration: 2.5s; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="loading" id="loadingState" role="status" aria-live="polite">
      <div class="loading-card">
        <div class="mark" aria-hidden="true">BZ</div>
        <h1>Membuka Operations Dashboard</h1>
        <p>Menyiapkan koneksi ke database Bakerzin…</p>
        <div class="progress" aria-hidden="true"><span></span></div>
        <div class="fallback" id="fallbackAction">
          <p>Dashboard membutuhkan waktu lebih lama dari biasanya.</p>
          <a href="https://https://script.google.com/macros/s/AKfycbxflaVXmoUkF1LNAcZlYJ4K7ZntHFNnMjuyFamWTS4uBa7eibKGOYeWHYOFUQDcMbGIaQ/exec" target="_top" rel="noopener">Buka Dashboard Langsung</a>
        </div>
      </div>
    </div>

    <iframe
      id="dashboardFrame"
      class="dashboard-frame"
      title="Bakerzin Operations Dashboard"
      src="https://https://script.google.com/macros/s/AKfycbxflaVXmoUkF1LNAcZlYJ4K7ZntHFNnMjuyFamWTS4uBa7eibKGOYeWHYOFUQDcMbGIaQ/exec"
      allow="clipboard-read; clipboard-write; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </main>

  <script>
    (function () {
      var frame = document.getElementById('dashboardFrame');
      var loading = document.getElementById('loadingState');
      var fallback = document.getElementById('fallbackAction');
      var loaded = false;

      frame.addEventListener('load', function () {
        loaded = true;
        window.setTimeout(function () { loading.classList.add('done'); }, 250);
      });

      window.setTimeout(function () {
        if (!loaded) fallback.classList.add('show');
      }, 12000);
    }());
  </script>
</body>
</html>
