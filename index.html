<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#A80E13">
  <meta name="description" content="Bakerzin Cost & Performance Intelligence Dashboard"><meta property="og:title" content="Bakerzin COGS Dashboard"><meta property="og:description" content="Cost & Performance Intelligence"><meta property="og:type" content="website"><meta property="og:image" content="https://pianzub.github.io/Bakerzin-COGS-Dashboard/og.png">
  <title>Bakerzin COGS Dashboard</title>
  <style>
    :root{--brand:#A80E13;--brand-dark:#75080C;--ink:#17202B;--muted:#788697;--canvas:#F4F7F9}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--canvas);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.shell{position:fixed;inset:0;width:100%;height:100%;background:var(--canvas)}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .28s ease}iframe.loaded{opacity:1}.loader{position:absolute;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;padding:28px;text-align:center;background:radial-gradient(circle at 50% 42%,#fff 0,#f7f9fa 45%,#edf2f5 100%)}.mark{display:grid;place-items:center;width:62px;height:62px;border-radius:18px;background:linear-gradient(145deg,var(--brand),var(--brand-dark));color:#fff;font-size:22px;font-weight:850;letter-spacing:-.04em;box-shadow:0 14px 34px rgba(117,8,12,.22)}h1{margin:18px 0 0;font-size:clamp(20px,3vw,28px);letter-spacing:-.03em}p{margin:7px 0 0;color:var(--muted);font-size:13px}.track{width:min(260px,70vw);height:4px;margin-top:24px;overflow:hidden;border-radius:99px;background:#dfe6eb}.track span{display:block;width:40%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),#dc4a41);animation:loading 1.15s ease-in-out infinite}.slow{display:none;max-width:420px;margin-top:22px;padding:12px 15px;border:1px solid #dfe5e9;border-radius:12px;background:rgba(255,255,255,.82);color:var(--muted);font-size:12px;line-height:1.5}.slow.show{display:block}.slow p{margin:0 0 7px;font-size:12px}.slow a{color:var(--brand);font-weight:750;text-decoration:none}.slow a:hover{text-decoration:underline}@keyframes loading{0%{transform:translateX(-105%)}55%{transform:translateX(110%)}100%{transform:translateX(260%)}}@media(prefers-reduced-motion:reduce){iframe{transition:none}.track span{animation-duration:2.4s}}
  </style>
</head>
<body><main class="shell"><iframe id="app" title="Bakerzin COGS Dashboard" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer" src="https://script.google.com/macros/s/AKfycbw3DyK06en6MF9g8QtSEWVl-y7NU3BQWuqI64V-YMKBmtr0-YJWJO3wSv5OOD1Hz39VxA/exec"></iframe><section class="loader" id="loader" aria-live="polite"><div class="mark" aria-hidden="true">BZ</div><h1>Bakerzin Intelligence</h1><p>Menyiapkan Cost &amp; Performance Dashboard</p><div class="track" aria-hidden="true"><span></span></div><div class="slow" id="slow"><p>Pemuatan lebih lama dari biasanya. Pastikan akun Google Anda memiliki akses.</p><a href="https://script.google.com/macros/s/AKfycbw3DyK06en6MF9g8QtSEWVl-y7NU3BQWuqI64V-YMKBmtr0-YJWJO3wSv5OOD1Hz39VxA/exec" target="_blank" rel="noreferrer">Buka dashboard langsung</a></div></section></main>
  <script>const frame=document.getElementById('app'),loader=document.getElementById('loader'),slow=document.getElementById('slow');const timer=setTimeout(()=>slow.classList.add('show'),12000);frame.addEventListener('load',()=>{clearTimeout(timer);frame.classList.add('loaded');loader.remove()});</script>
</body>
</html>
